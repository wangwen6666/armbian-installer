name: "Build Armbian Installer ISO"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "版本类型"
        required: true
        default: "ubuntu26_minimal"
        type: choice
        options:
          - "ubuntu26_minimal"
          - "debian13_minimal"
      armbian_source:
        description: "Armbian 镜像来源"
        required: true
        default: "official"
        type: choice
        options:
          - "official"
          - "github"

jobs:
  build-release:
    runs-on: ubuntu-22.04
    env:
      VERSION_TYPE: ${{ github.event.inputs.version_type }}
      ARMbian_SOURCE: ${{ github.event.inputs.armbian_source }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: ./build.sh

      - name: "Prepare Release Assets"
        run: |
          # 根据版本类型重命名ISO文件
          if [ "$VERSION_TYPE" = "debian13_minimal" ]; then
            mv output/armbian-installer-x86_64-standard.iso output/armbian-installer-x86_64-debian13_minimal.iso
          fi

          if [ "$VERSION_TYPE" = "ubuntu26_minimal" ]; then
            mv output/armbian-installer-x86_64-standard.iso output/armbian-installer-x86_64-ubuntu26_minimal.iso
          fi

      - name: "Publish"
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "Armbian-Installer-x86_64-ISO"
          body_path: ${{ github.workspace }}/info.md
          files: |
            output/armbian-installer-x86_64-${{ github.event.inputs.version_type }}.iso
          token: ${{ secrets.GITHUB_TOKEN }}